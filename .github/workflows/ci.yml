name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Detector throughput smoke check
        run: python -m gpumon loadtest --events 50000

  frontend:
    name: frontend (react build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - name: Type-check and build
        run: npm run build

  infrastructure:
    name: infrastructure (cdk synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - name: TypeScript build
        run: npm run build
      - name: CDK synth
        run: npx cdk synth --quiet
